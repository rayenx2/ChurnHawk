<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bgChurnHawk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accChurnHawk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="iconChurnHawk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glowChurnHawk" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridChurnHawk" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="rgChurnHawk" cx="85%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bgChurnHawk)"/>
  <rect width="1280" height="320" fill="url(#gridChurnHawk)" opacity="0.4"/>
  <rect width="1280" height="320" fill="url(#rgChurnHawk)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#accChurnHawk)" opacity="0.7"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#accChurnHawk)"/>

  <g transform="translate(64, 112)" filter="url(#glowChurnHawk)">
    <rect width="96" height="96" rx="16" fill="url(#iconChurnHawk)"/>
    <g transform="translate(24, 24) scale(2)">
      <path d="M23 4v6h-6M1 20v-6h6" fill="none" stroke="#ffffff" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" fill="none" stroke="#ffffff" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="184" y="158" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="62" font-weight="700" fill="#f1f5f9" letter-spacing="-2">
    Churn<tspan fill="url(#accChurnHawk)">Hawk</tspan>
  </text>

  <text x="186" y="198" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="400" fill="#64748b" letter-spacing="0.2">
    Customer churn prediction MLOps pipeline  ·  XGBoost  ·  Airflow  ·  MLflow
  </text>

  <line x1="184" y1="218" x2="820" y2="218" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(184, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">XGBOOST</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">92% accuracy</text>
  </g>
  <g transform="translate(314, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">SHAP</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">explainability</text>
  </g>
  <g transform="translate(444, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">DRIFT</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">monitoring</text>
  </g>
  <g transform="translate(574, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">AIRFLOW</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">scheduled</text>
  </g>
</svg>
